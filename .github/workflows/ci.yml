name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Dependency audit
        run: npm run audit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-000000
          NEXT_PUBLIC_LIVEKIT_URL: wss://example.livekit.cloud
          NEXT_PUBLIC_SITE_URL: https://example.com
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key-0000
          LIVEKIT_API_KEY: APIci
          LIVEKIT_API_SECRET: ci-placeholder-livekit-secret

      - name: Scan the build for leaked secrets
        run: npm run secrets:scan

  # Applies every migration to a real Postgres and attacks it as anon, a
  # signed-in stranger, a host, and staff with and without a second factor.
  # This is where an RLS or grant regression gets caught.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Migrations + authorisation tests
        run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Bundled migrations are up to date
        run: |
          node scripts/bundle-migrations.mjs
          git diff --quiet -I '^-- Generated ' -- supabase/_all_migrations.sql \
            || { echo "Run npm run db:bundle and commit the result."; exit 1; }

  # CodeQL needs GitHub Advanced Security on a private repo. It runs
  # automatically if this repo is ever made public; until then the `verify`
  # job above is the gate.
  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
