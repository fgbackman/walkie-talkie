name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Dependency audit
        run: npm run audit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-000000
          NEXT_PUBLIC_LIVEKIT_URL: wss://example.livekit.cloud
          NEXT_PUBLIC_SITE_URL: https://example.com
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key-0000
          LIVEKIT_API_KEY: APIci
          LIVEKIT_API_SECRET: ci-placeholder-livekit-secret

      - name: Scan the build for leaked secrets
        run: npm run secrets:scan

  # CodeQL needs GitHub Advanced Security on a private repo. It runs
  # automatically if this repo is ever made public; until then the `verify`
  # job above is the gate.
  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
