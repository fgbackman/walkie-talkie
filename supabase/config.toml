project_id = "walkie-talkie"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Server-side session limits (hosted projects: Authentication -> Sessions;
# needs a paid plan). The app also signs out after 7 idle days on its own
# (src/lib/session.ts), so this is the second layer, not the only one.
[auth.sessions]
timebox = "720h"
inactivity_timeout = "168h"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false
